            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;

        }

        :root[data-theme="light"] {

            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;

            align-items: center;
            gap: 8px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            cursor: pointer;

            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            outline: none;
        }

            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;

            color: var(--text-primary);

            border: 1px solid var(--border);

            border-bottom: 1px solid var(--border);

            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            position: relative;

        .tab-btn.active {
            color: var(--accent);
        }

            content: '';
            position: absolute;
            bottom: -11px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent);
            border-radius: 3px 3px 0 0;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .book-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .book-cover {
            height: 280px;
            position: relative;
            overflow: hidden;
            background: #cbd5e1;
        }

            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            position: absolute;

            height: 35px;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);

            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

            margin-bottom: 6px;
            display: -webkit-box;

            -webkit-box-orient: vertical;

        }

        .book-footer {

            justify-content: space-between;
            align-items: center;

        .book-price {

            color: var(--accent);

            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;

        }

        .btn-action.read {

        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;

            pointer-events: auto;
        }

            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);

            justify-content: space-between;
            align-items: center;

                author: "Xudoyberdi To'xtaboyev",
                category: "Badiiy",
                price: 16000,
                cover: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=500&q=80",
                pages: [
                    "1-sahifa: Hoshimjonning qiziqarli sarguzashtlari va sehrli buyumlar.",
                    "2-sahifa: Yolg'on gapirishning oqibatlari va boshga tushgan sinovlar.",

                    "4-sahifa: Qilmish-qidirmish, yaxshilikning mukofoti.",
                    "5-sahifa: Bolalar adabiyotining durdona asari."
                ]
            },
            {
                id: 10,
                title: "Saodat Asri Qissalari",
                author: "Ahmad Lutfiy Qozonchi",
                category: "Islomiy",
                price: 25000,
                cover: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=500&q=80",
                pages: [
                    "1-sahifa: Islom nuri porlagan ilk davrlar va sahobalarning fidoyiligi.",
                    "2-sahifa: Madinai munavvaradagi birodarlik va adolat muhiti.",
                    "3-sahifa: Rasululloh (s.a.v.)ning go'zal axloqlari va hayot yo'llari.",
                    "4-sahifa: Islom yo'lida chekilgan mashaqqatlar va sabr namunasi.",
                    "5-sahifa: Tarixdagi eng sharafli va namuna bo'ladigan davr."
                ]
            }
        ];

        let userBalance = 15000;
        let purchasedBookIds = [1, 3];
        let favoriteBookIds = [2, 4, 6];
        let currentTab = 'shop';
        let currentCategory = 'all';
        let searchQuery = '';
        let activeReadingBook = null;
        let currentActivePage = 0;
        let selectedPayAmount = 10000;

        window.onload = function() {
            updateBalanceUI();
            renderBooks();
            updateFavCount();
            initTheme();
            changeLanguage('uz');
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('huzayfa_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('huzayfa_theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // Tilni o'zgartirish funksiyasi
        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('brandName').innerText = t.brand;
            document.getElementById('currencyText').innerText = t.currency;
            document.getElementById('tabShop').innerHTML = `<i class="fa-solid fa-store"></i> ${t.tabShop}`;
            document.getElementById('tabMyBooks').innerHTML = `<i class="fa-solid fa-book-bookmark"></i> ${t.tabMyBooks}`;
            document.getElementById('tabFav').innerHTML = `<i class="fa-solid fa-heart"></i> ${t.tabFav} (<span id="favCount">${favoriteBookIds.length}</span>)`;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            
            document.getElementById('catAll').innerText = t.catAll;
            document.getElementById('catIslam').innerText = t.catIslam;
            document.getElementById('catArt').innerText = t.catArt;
            document.getElementById('catMotiv').innerText = t.catMotiv;
            document.getElementById('catHistory').innerText = t.catHistory;

            document.getElementById('txtPrev').innerText = t.prev;
            document.getElementById('txtNext').innerText = t.next;
            document.getElementById('btnCloseReader').innerText = t.close;
            document.getElementById('payModalTitle').innerHTML = `<i class="fa-solid fa-credit-card" style="color: var(--accent);"></i> ${t.payTitle}`;
            document.getElementById('payModalDesc').innerText = t.payDesc;
            document.getElementById('payBtnConfirm').innerText = t.payConfirm;

            renderBooks();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            const tabs = document.querySelectorAll('.app-tabs .tab-btn');
            tabs.forEach((btn, idx) => {
                btn.classList.remove('active');
                if((tabName === 'shop' && idx === 0) || (tabName === 'mybooks' && idx === 1) || (tabName === 'favorites' && idx === 2)) {
                    btn.classList.add('active');
                }
            });

            const filterSec = document.getElementById('filterSection');
            filterSec.style.display = tabName === 'shop' ? 'flex' : 'none';
            renderBooks();
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderBooks();
        }

        function filterBooks() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderBooks();
        }

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';
            const t = translations[currentLang];

            let filtered = booksData.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(searchQuery) || book.author.toLowerCase().includes(searchQuery);
                if (currentTab === 'shop') {
                    const matchesCategory = currentCategory === 'all' || book.category === currentCategory;
                    return matchesSearch && matchesCategory;
                } else if (currentTab === 'mybooks') {
                    return purchasedBookIds.includes(book.id) && matchesSearch;
                } else if (currentTab === 'favorites') {
                    return favoriteBookIds.includes(book.id) && matchesSearch;
                }
                return false;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-secondary);">
                        <i class="fa-solid fa-face-open-eyes" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <p style="font-size: 1.1rem;">${t.emptyBooks}</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(book => {
                const isPurchased = purchasedBookIds.includes(book.id);
                const isFavorite = favoriteBookIds.includes(book.id);

                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover">
                        <img src="${book.cover}" alt="${book.title}" loading="lazy">
                        <button class="favorite-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite(${book.id}, event)">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                    <div class="book-info">
                        <div>
                            <div class="book-title" title="${book.title}">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                        <div class="book-footer">
                            <span class="book-price">${isPurchased ? t.bought : book.price.toLocaleString() + " " + t.currency}</span>
                            ${isPurchased 
                                ? `<button class="btn-action read" onclick="openReader(${book.id})"><i class="fa-solid fa-book-open"></i> ${t.read}</button>`
                                : `<button class="btn-action" onclick="buyBook(${book.id})">${t.buy}</button>`
                            }
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleFavorite(bookId, event) {
            event.stopPropagation();
            const index = favoriteBookIds.indexOf(bookId);
            if (index > -1) {
                favoriteBookIds.splice(index, 1);
            } else {
                favoriteBookIds.push(bookId);
            }
            updateFavCount();
            renderBooks();
        }

        function updateFavCount() {
            const countEl = document.getElementById('favCount');
            if(countEl) countEl.innerText = favoriteBookIds.length;
        }

        function buyBook(bookId) {
            const book = booksData.find(b => b.id === bookId);
            const t = translations[currentLang];
            if (!book) return;

            if (userBalance >= book.price) {
                userBalance -= book.price;
                purchasedBookIds.push(bookId);
                updateBalanceUI();
                renderBooks();
                alert(`"${book.title}" ${t.alertBought}`);
            } else {
                if(confirm(t.alertNoMoney)) {
                    openPaymentModal();
                }
            }
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = userBalance.toLocaleString();
        }

        function openReader(bookId) {
            const book = booksData.find(b => b.id === bookId);
            if (!book) return;

            activeReadingBook = book;
            currentActivePage = 0;

            document.getElementById('readerBookTitle').innerText = book.title;
            document.getElementById('readerBookAuthor').innerText = book.author;
            
            updateReaderContent();
            document.getElementById('readerModal').classList.add('open');
        }

        function closeReader() {
            document.getElementById('readerModal').classList.remove('open');
            activeReadingBook = null;
        }

        function updateReaderContent() {
            if (!activeReadingBook) return;
            const contentEl = document.getElementById('readerPageContent');
            const indicatorEl = document.getElementById('pageIndicator');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            contentEl.innerText = activeReadingBook.pages[currentActivePage];
            indicatorEl.innerText = `${currentActivePage + 1} / ${activeReadingBook.pages.length}`;

            prevBtn.disabled = currentActivePage === 0;
            nextBtn.disabled = currentActivePage === activeReadingBook.pages.length - 1;
        }

        function changePage(direction) {
            if (!activeReadingBook) return;
            const newPage = currentActivePage + direction;
            if (newPage >= 0 && newPage < activeReadingBook.pages.length) {
                currentActivePage = newPage;
                updateReaderContent();
                document.querySelector('.reader-body').scrollTop = 0;
            }
        }

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.add('open');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('open');
        }

        function selectAmount(amount, element) {
            selectedPayAmount = amount;
            document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function processPayment() {
            userBalance += selectedPayAmount;
            const t = translations[currentLang];
            updateBalanceUI();
            closePaymentModal();
            renderBooks();
            alert(`${t.alertPaid} (+${selectedPayAmount.toLocaleString()} ${t.currency})`);
        }
    </script>
</body>
